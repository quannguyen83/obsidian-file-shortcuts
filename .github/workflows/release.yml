name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed build
        run: git diff --exit-code -- main.js
      - name: Publish assets for BRAT
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a numeric major.minor.patch version in manifest.json.'
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; published assets are left unchanged."
            exit 0
          fi
          cat > /tmp/file-shortcuts-release-notes.md <<'NOTES'
          File shortcuts inside Obsidian: right-click a file or folder to create a named .obslink, then click it to open the original vault file.

          Install with BRAT: Add a beta plugin → quannguyen83/obsidian-file-shortcuts → Add Plugin → enable File Shortcuts.

          Assets: main.js, manifest.json, styles.css. Requires Obsidian 1.7.2 or newer.

          Includes target rename tracking and repair for missing targets. Build and automated API-double tests pass; desktop Obsidian testing is still needed.
          NOTES
          gh release create "$VERSION" main.js manifest.json styles.css \
            --target "$GITHUB_SHA" --title "File Shortcuts $VERSION" \
            --notes-file /tmp/file-shortcuts-release-notes.md
